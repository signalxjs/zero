packages:
  - packages/*
  - examples/*

onlyBuiltDependencies:
  - esbuild

# Single source of truth for the SignalX core version this repo builds against.
# `^1.0.0` == `>=1.0.0 <2.0.0` (one MAJOR, now that core is 1.x — before 1.0
# a caret spanned one minor). @sigx/reactivity keeps reactive state in
# module-local variables, so two physical copies of core silently split its
# singletons and break reactivity; one range forces pnpm to hoist ONE copy
# (core 1.0 also ships a duplicate-copy guard of its own). Bump this one
# block to move the whole repo to a new core line. Consumed via `"catalog:"` in package.json (peerDeps + devDeps);
# `pnpm pack` rewrites `catalog:` to the concrete range in the published manifest.
catalog:
  "@sigx/reactivity": ^1.0.0
  "@sigx/runtime-core": ^1.0.0
  "@sigx/runtime-dom": ^1.0.0
  "@sigx/server-renderer": ^1.0.0
  # Was pinned to ^0.13 while @sigx/vite >= 0.14 failed to resolve `?url`
  # imports of package subpath exports (#352); core 1.0 resolves them (its
  # #678, "query-suffixed subpath imports resolve through the dev alias
  # map"), verified by the playground's smoke spec, so it rides with the
  # rest (#145).
  "@sigx/vite": ^1.0.0
  sigx: ^1.0.0
