name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The merge queue (#159) builds each queued group on a temporary ref and
  # waits for the required checks to report on it.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['20', '22']
        include:
          - os: windows-latest
            node-version: '22'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Every core dep must flow through a single-minor catalog (one hoisted
      # copy). Cheap static check; fails fast before build/test.
      - name: Verify catalog
        run: pnpm verify:catalog

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Isolated projects — module augmentation leaks program-wide, so the
      # augmented assertions must never share a program with `pnpm typecheck`.
      # After Build as a belt: the paths map resolves everything in source
      # (pinned by type-test-paths.test.ts), but until #316 unmapped subpaths
      # fell through to dist/ — absent here — and skipLibCheck swallowed the
      # unresolved imports, so this step was green while checking a quarter
      # of the components surface.
      - name: Type tests
        run: pnpm test:types

      - name: Test
        run: pnpm test

  e2e-shard:
    # The suite outgrew one job (#352): at ~2,800 tests it ran ~29 min against
    # the 30 min cap, and every run was cancelled with nothing failing.
    # Playwright's --shard splits the tests evenly, so each shard runs about a
    # third of the suite. The timeout still keeps a hung browser from holding
    # the queue for hours. The required check is the `e2e` job below, not
    # these shards, so the shard count can change without a ruleset edit.
    name: e2e (shard ${{ matrix.shard }}/3)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The root typecheck excludes examples/, so the playground has its own —
      # and until #316 no CI step ran it.
      - name: Playground typecheck
        run: pnpm --filter zero-playground typecheck

      # The consumer-side capstone (#326): three isolated programs compiling
      # against the EMITTED dist/ artifacts through package exports — which
      # is why this must run after Build, and why it lives in this job
      # rather than the source-aliased test matrix.
      - name: Typed-app typecheck (emitted artifacts)
        run: pnpm --filter zero-typed-app typecheck

      # Browser binaries are cached on the Playwright version (#196). The
      # system libraries still come from apt every run — `install-deps` —
      # so a hit only saves the download, not the whole step.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter zero-playground exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter zero-playground exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter zero-playground exec playwright install-deps chromium firefox webkit

      # `exec`, not the `e2e` script: `pnpm --filter … e2e -- <args>` drops
      # the arguments (AGENTS.md).
      - name: Real-browser interaction suite
        run: pnpm --filter zero-playground exec playwright test --shard=${{ matrix.shard }}/3

      # A failure used to leave only the github-reporter annotations (#196).
      # The HTML report plus test-results/ carry the traces recorded on the
      # first retry (playwright.config.ts), openable with `playwright
      # show-trace` or `show-report`.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            examples/playground/playwright-report/
            examples/playground/test-results/
          retention-days: 14

  e2e:
    # The required check, and it also runs in the merge queue: a PR's own run
    # predates whatever landed ahead of it (#159). It passes only when every
    # shard passed. `always()` makes a failed or cancelled shard report as a
    # failure here rather than a skip, because a skipped required check would
    # not block the merge.
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "e2e shards: ${{ needs.e2e-shard.result }}"
            exit 1
          fi

  verify-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pack
        run: pnpm verify:pack

  coverage:
    # Already ran on the PR; the queue only waits on the required checks.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
