# Publishes every package in scripts/publish.js to npm with trusted publishing
# (OIDC, configured per package on npmjs.com), then cuts the GitHub release.
# The release process lives in AGENTS.md, "Cutting a release".
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Top-level permissions are intentionally minimal. Each job declares what it
# actually needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    # OIDC for npm trusted publishing; read-only on contents.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # First, before anything builds (#196): the tag must equal every
      # publishable package's version. publish.js publishes what package.json
      # says and skips what npm already has, so a v0.6.0 tag on the 0.5.0
      # commit used to skip everything, exit 0 and still cut a GitHub release
      # — and a prerelease tag on a stable version would publish to `latest`.
      # Needs no dependencies: the runner's own node reads the package.json files.
      - name: Check tag matches package versions
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # npm trusted publishing needs npm >= 11.5.1. Node 24 ships npm 11.x,
      # but pin to latest so we never silently fall behind a publish-side fix.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify pack
        run: pnpm verify:pack

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: node scripts/publish.js --provenance

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    # Only this job needs write — npm publish already happened above.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # A prerelease tag (v0.3.0-beta.1) is marked as such and never
          # becomes the repo's "latest" release — core's policy (its #689),
          # and the same rule publish.js applies on npm, where a prerelease
          # lands on its own dist-tag (`beta`) and never on `latest`.
          case "$TAG" in
            *-*) FLAGS="--prerelease --latest=false" ;;
            *)   FLAGS="--latest" ;;
          esac
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            gh release edit "$TAG" --draft=false $FLAGS
          else
            gh release create "$TAG" --generate-notes $FLAGS
          fi
