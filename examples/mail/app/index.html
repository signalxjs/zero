<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Zero Mail</title>
        <!-- themeInitScript({ storageKey: 'zero-mail-theme' }): restore an explicit theme before first paint. -->
        <script>(function(){try{var t=localStorage.getItem("zero-mail-theme");if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
